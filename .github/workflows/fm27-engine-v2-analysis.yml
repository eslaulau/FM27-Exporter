name: FM27 v2 native engine analysis
on:
  push:
    paths:
      - ".github/workflows/fm27-engine-v2-analysis.yml"
      - "scripts/engine_analysis/fm27_package_audit.py"
      - "scripts/ghidra/ExportMatchEngineFast.java"
      - "scripts/ghidra/ExportMatchEnginePressingCore.java"
      - "scripts/ghidra/ExportNativeRttiTargets.java"
      - "scripts/ghidra/TraceNativeScoreAndTactic.java"
      - "scripts/ghidra/DecompileNativeRttiXrefFunctions.java"
      - "scripts/engine_analysis/scan_native_match_player_fields.py"
      - "scripts/engine_analysis/scan_native_target_callers.py"
      - "scripts/engine_analysis/derive_role_duty_compact_ids.py"
      - "scripts/engine_analysis/fm27_package_audit.py"
      - "scripts/ghidra/AnnotateIl2CppMethods.java"
      - "scripts/engine_analysis/extract_il2cpp_match_methods.py"
      - "scripts/engine_analysis/extract_il2cpp_tactic_bridge_methods.py"
      - "scripts/ghidra/DecompileTacticBridgeMethods.java"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fm27-27-1-1-native-analysis
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout analysis tools
        uses: actions/checkout@v4

      - name: Download and verify the complete v2 package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/eslaulau/FM27-Exporter/releases/download/fm27-saves/FM27_Engine_Analysis_Package_20261125_v2.zip" \
            --output FM27_Engine_Analysis_Package_20261125_v2.zip
          echo "99f5207337e1f9cad84a4771ec08df6c9c9e34bea7c33ace7668124ca6bbb8d6  FM27_Engine_Analysis_Package_20261125_v2.zip" | sha256sum --check

      - name: Extract package safely
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path("game").resolve()
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile("FM27_Engine_Analysis_Package_20261125_v2.zip") as archive:
              for item in archive.infolist():
                  name = item.filename.replace(chr(92), "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename!r}")
                  if item.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(item) as src, target.open("wb") as dst:
                          while chunk := src.read(1024 * 1024):
                              dst.write(chunk)
          PY

      - name: Audit all seven files and extract targeted strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/package-audit
          if python scripts/engine_analysis/fm27_package_audit.py \
            --root game --out analysis/package-audit \
            > analysis/package-audit-console.log 2>&1; then
            echo 0 > analysis/package-audit-exit-code.txt
          else
            code=$?
            echo "$code" > analysis/package-audit-exit-code.txt
            cat analysis/package-audit-console.log
            exit "$code"
          fi
          XREF_TSV="analysis/package-audit/native-rtti/native-rtti-code-xrefs.tsv"
          test -s "$XREF_TSV"
          awk -F '\t' 'NR > 1 && $6 != "" { found=1 } END { exit !found }' "$XREF_TSV"
          cat analysis/package-audit-console.log

      - name: Scan native MATCH_PLAYER and OOP tactical field consumers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check capstone==5.0.6
          python scripts/engine_analysis/scan_native_match_player_fields.py \
            --binary game/fm_Data/Plugins/x86_64/game_plugin.dll \
            --out analysis/match-player-fields \
            > analysis/match-player-fields-console.log 2>&1
          test -s analysis/match-player-fields/match-player-field-xrefs-ghidra.tsv
          cat analysis/match-player-fields-console.log

      - name: Scan direct callers of native PI/role decision functions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/engine_analysis/scan_native_target_callers.py \
            --binary game/fm_Data/Plugins/x86_64/game_plugin.dll \
            --out analysis/native-target-callers \
            --target 0xA8F70:PI_BEHAVIOR_CANDIDATE_AGGREGATOR \
            --target 0x4813B90:ROLE_PI_COMMON_VALIDATOR \
            --target 0x36BE0:HALF_BACK_DROPPING_DM_GATE \
            --target 0xA7280:TRACKING_CENTRE_FORWARD_CANDIDATE_BUILDER \
            --target 0xA77D0:PI_STATE_FILTER_AND_GATE \
            --target 0xA79A0:TAKE_FEWER_RISKS_STOPPER_GATE \
            --target 0xA7D20:CROSSING_PI_SPATIAL_GATE \
            --target 0xA82F0:ROLE_DUTY_PI_POSITION_GATE \
            --target 0xA8080:PI_TRIGGER_PHASE_TARGET_GATE \
            --target 0x72B20:MATCH_PLAYER_OOP_SLOT_REFRESH \
            --target 0x4862CB0:TRACKING_CF_CANDIDATE_PIPELINE_CALLER \
            --target 0x4865900:MATCH_PLAYER_CANDIDATE_STATE_PRODUCER \
            --target 0x4873400:OOP_CANDIDATE_FILTER_GATE \
            --target 0x4874AC0:PHASE_CANDIDATE_STATE_PROCESSOR \
            --target 0x492D840:MOVEMENT_DIRECTOR_SPATIAL_POST_TRANSFORM \
            --target 0x494F820:MOVEMENT_CANDIDATE_FINAL_VALIDATOR \
            --target 0x11FA50:OOP_ATTRIBUTE_CONFIG_TO_VALUE \
            --target 0x11E260:PITCH_PROXIMITY_CONFIG_TO_VALUE \
            --target 0x47FA990:PRESSING_MANAGER_IMPL_A \
            --target 0x4996D50:PRESSING_MANAGER_IMPL_B \
            --target 0x4997910:PRESSING_MANAGER_IMPL_C \
            --target 0x2B05590:COPY_PLAYER_TACTICAL_CANDIDATE_STATE \
            --target 0x4BF9BA0:OOP_SCORING_PROVIDER_INITIALIZER \
            --target 0x4BFAE10:OOP_ATTRIBUTE_SCORER_CONFIG_MEMBER \
            --target 0x4BFA570:PITCH_PROXIMITY_SCORER_CONFIG_MEMBER \
            --target 0x4C2DA40:IOOP_SCORING_PROVIDER_POSITION_METHOD \
            --target 0x4C2DAA0:IOOP_SCORING_PROVIDER_METHOD \
            --target 0x4C351E0:IOOP_SCORE_VIRTUAL_EVALUATION_THUNK \
            --target 0x4C15850:UDYNAMIC_SCORES_VTABLE_INITIALIZER \
            --target 0x4C157F0:UDYNAMIC_POSITION_SCORES_VTABLE_INITIALIZER \
            --target 0x4C01760:XG_SHOT_DATA_CONSUMER_OR_BUILDER \
            --target 0x481A6A0:ADVANCED_SHOT_ZONE_DATA_CONSUMER \
            --target 0x268B330:SHOT_ZONE_DATA_CONSUMER \
            --target 0x335C40:SHOT_ZONE_DATA_PROCESSOR_A \
            --target 0x62682B0:SHOT_ZONE_DATA_PROCESSOR_B
            > analysis/native-target-callers-console.log 2>&1
          test -s analysis/native-target-callers/native-target-call-xrefs.tsv
          cat analysis/native-target-callers-console.log

      - name: Set up .NET 10 for IL2CPP metadata decoding
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build pinned IL2CPP Dumper CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.2.1 \
            https://github.com/AndnixSH/Il2CppDumper.git tools/Il2CppDumper
          dotnet publish tools/Il2CppDumper/Il2CppDumper.CLI/Il2CppDumper.CLI.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -o tools/Il2CppDumper/publish/linux-x64
          test -x tools/Il2CppDumper/publish/linux-x64/Il2CppDumper

      - name: Decode IL2CPP types, fields, methods and Ghidra maps
        shell: bash
        run: |
          set +e
          mkdir -p analysis/il2cpp
          tools/Il2CppDumper/publish/linux-x64/Il2CppDumper \
            game/GameAssembly.dll \
            game/fm_Data/il2cpp_data/Metadata/global-metadata.dat \
            -o analysis/il2cpp \
            --fast --threads 4 \
            --scripts ghidra,il2cpp_header_to_ghidra \
            --no-pause \
            > analysis/il2cpp/il2cpp-dumper.log 2>&1
          echo $? > analysis/il2cpp/il2cpp-dumper-exit-code.txt
          tail -n 250 analysis/il2cpp/il2cpp-dumper.log || true
          find analysis/il2cpp -maxdepth 3 -type f -printf '%p %s bytes\n' | sort \
            > analysis/il2cpp/output-manifest.txt
          if [ -s analysis/il2cpp/script.json ]; then
            python scripts/engine_analysis/extract_il2cpp_match_methods.py \
              --input analysis/il2cpp/script.json \
              --output analysis/il2cpp/match-relevant-methods.tsv \
              > analysis/il2cpp/method-map-summary.log 2>&1
          else
            echo "script.json missing or empty; skipping managed method map" > analysis/il2cpp/method-map-summary.log
            : > analysis/il2cpp/tactic-bridge-methods.tsv
          fi
          if [ -s analysis/il2cpp/script.json ]; then
            python scripts/engine_analysis/extract_il2cpp_tactic_bridge_methods.py \
              --input analysis/il2cpp/script.json \
              --output analysis/il2cpp/tactic-bridge-methods.tsv \
              > analysis/il2cpp/tactic-bridge-methods-summary.log 2>&1
          fi
          set -e

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" \
            --output ghidra.zip
          mkdir ghidra
          unzip -q ghidra.zip -d ghidra

      - name: Annotate GameAssembly with tactic and match IL2CPP symbols
        shell: bash
        run: |
          set +e
          mkdir -p analysis/gameassembly ghidra-project-gameassembly
          if [ ! -s analysis/il2cpp/match-relevant-methods.tsv ]; then
            echo "No IL2CPP method map generated; skipping GameAssembly annotation." \
              > analysis/gameassembly/annotation-skipped.txt
            exit 0
          fi
          GHIDRA_DIR=$(find ghidra -type f -name analyzeHeadless -printf '%h\n' | head -n1)
          chmod +x "$GHIDRA_DIR/analyzeHeadless"
          "$GHIDRA_DIR/analyzeHeadless" "$PWD/ghidra-project-gameassembly" FM27GameAssembly \
            -import "game/GameAssembly.dll" \
            -overwrite -noanalysis \
            -scriptPath scripts/ghidra \
            -postScript AnnotateIl2CppMethods.java \
              "$PWD/analysis/il2cpp/match-relevant-methods.tsv" \
              "$PWD/analysis/gameassembly" \
            -postScript DecompileTacticBridgeMethods.java \
              "$PWD/analysis/il2cpp/tactic-bridge-methods.tsv" \
              "$PWD/analysis/gameassembly-tactic-bridge" \
            > analysis/gameassembly/ghidra-console.log 2>&1
          echo $? > analysis/gameassembly/ghidra-exit-code.txt
          tail -n 180 analysis/gameassembly/ghidra-console.log || true
          set -e

      - name: Unified native engine analysis (seed map, pressing flow, RTTI classes)
        shell: bash
        run: |
          set +e
          mkdir -p analysis/ghidra analysis/ghidra-pressing analysis/native-rtti ghidra-project-native
          GHIDRA_DIR=$(find ghidra -type f -name analyzeHeadless -printf '%h\n' | head -n1)
          chmod +x "$GHIDRA_DIR/analyzeHeadless"
          ARGS=(
            -import "game/fm_Data/Plugins/x86_64/game_plugin.dll"
            -overwrite
            -noanalysis
            -scriptPath scripts/ghidra
            -postScript ExportMatchEngineFast.java "$PWD/analysis/ghidra"
            -postScript ExportMatchEnginePressingCore.java "$PWD/analysis/ghidra-pressing"
          )
          RTTI_TSV="analysis/package-audit/native-rtti/native-rtti-vtables.tsv"
          if [ -s "$RTTI_TSV" ]; then
            ARGS+=(
              -postScript ExportNativeRttiTargets.java
              "$PWD/$RTTI_TSV"
              "$PWD/analysis/native-rtti"
            )
          else
            echo "No native RTTI vtable output; class-target pass skipped." \
              > analysis/native-rtti/analysis-skipped.txt
          fi
          ARGS+=(
            -postScript TraceNativeScoreAndTactic.java "$PWD/analysis/native-score-trace"
          )
          TARGET_CALL_XREFS="analysis/native-target-callers/native-target-call-xrefs.tsv"
          if [ -s "$TARGET_CALL_XREFS" ]; then
            ARGS+=(
              -postScript DecompileNativeRttiXrefFunctions.java
              "$PWD/$TARGET_CALL_XREFS"
              "$PWD/analysis/native-target-callers-decompiled"
            )
          fi
          FIELD_XREF_TSV="analysis/match-player-fields/match-player-field-xrefs-ghidra.tsv"
          if [ -s "$FIELD_XREF_TSV" ]; then
            ARGS+=(
              -postScript DecompileNativeRttiXrefFunctions.java
              "$PWD/$FIELD_XREF_TSV"
              "$PWD/analysis/match-player-field-consumers"
            )
          else
            echo "MATCH_PLAYER field consumer map missing." \
              > analysis/match-player-field-consumers-skipped.txt
          fi
          XREF_TSV="analysis/package-audit/native-rtti/native-rtti-code-xrefs.tsv"
          if [ -s "$XREF_TSV" ]; then
            ARGS+=(
              -postScript DecompileNativeRttiXrefFunctions.java
              "$PWD/$XREF_TSV"
              "$PWD/analysis/native-rtti-callers"
            )
          else
            echo "Native RTTI code xrefs unavailable; caller-function pass skipped." \
              > analysis/native-rtti-callers-skipped.txt
          fi
          "$GHIDRA_DIR/analyzeHeadless" "$PWD/ghidra-project-native" FM27NativeUnified \
            "${ARGS[@]}" \
            > analysis/native-engine-unified-console.log 2>&1
          echo $? > analysis/native-engine-unified-exit-code.txt
          tail -n 300 analysis/native-engine-unified-console.log || true
          set -e
          test -s analysis/ghidra/seed-decompilations.txt
          test -s analysis/ghidra-pressing/pressing-core-summary.txt
          test -s analysis/native-score-trace/native-score-tactic-summary.txt
          test -s analysis/native-rtti/native-rtti-target-summary.txt
          if [ -s "$TARGET_CALL_XREFS" ]; then
            test -s analysis/native-target-callers-decompiled/native-rtti-caller-summary.txt
            grep -Eq 'ANALYZED_CALLER_FUNCTIONS=[1-9][0-9]*' \
              analysis/native-target-callers-decompiled/native-rtti-caller-summary.txt
          fi
          if [ -s "$FIELD_XREF_TSV" ]; then
            test -s analysis/match-player-field-consumers/native-rtti-caller-summary.txt
          fi
          if [ -s "$XREF_TSV" ]; then
            test -s analysis/native-rtti-callers/native-rtti-caller-summary.txt
          fi

      - name: Generate verified IP/OOP role and duty compact-ID map
        shell: bash
        run: |
          set -euo pipefail
          python scripts/engine_analysis/derive_role_duty_compact_ids.py \
            --dump analysis/il2cpp/dump.cs \
            --decomp analysis/native-score-trace/native-score-tactic-decompilations.txt \
            --outdir analysis/role-duty-map
          test -s analysis/role-duty-map/role-duty-compact-ids.tsv
          cat analysis/role-duty-map/role-duty-compact-ids-summary.json

      - name: Upload package audit, IL2CPP maps and Ghidra output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FM27-v2-Engine-Analysis
          path: analysis/
          if-no-files-found: warn
          retention-days: 14
