name: FM27 native hotspot reverse engineering
on:
  push:
    paths:
      - ".github/workflows/fm27-native-hotspot-analysis.yml"
      - "scripts/ghidra/TraceNativeHotspots.java"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fm27-native-hotspot-analysis
  cancel-in-progress: true
jobs:
  hotspots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout analysis tools
        uses: actions/checkout@v4

      - name: Download and verify FM27 native package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/eslaulau/FM27-Exporter/releases/download/fm27-saves/FM27_Engine_Analysis_Package_20261125_v2.zip" \
            --output FM27_Engine_Analysis_Package_20261125_v2.zip
          echo "99f5207337e1f9cad84a4771ec08df6c9c9e34bea7c33ace7668124ca6bbb8d6  FM27_Engine_Analysis_Package_20261125_v2.zip" | sha256sum --check
          mkdir -p game
          python - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path("game").resolve()
          with zipfile.ZipFile("FM27_Engine_Analysis_Package_20261125_v2.zip") as z:
              for item in z.infolist():
                  name=item.filename.replace(chr(92),"/")
                  target=(root/name).resolve()
                  if target!=root and root not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {item.filename!r}")
                  if item.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(item) as src,target.open("wb") as dst:
                          while chunk:=src.read(1024*1024):
                              dst.write(chunk)
          PY
          test -s game/fm_Data/Plugins/x86_64/game_plugin.dll

      - name: Scan native direction-generator input-field readers and writers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check capstone==5.0.6
          mkdir -p analysis/native-hotspots/direction-generator-fields
          python scripts/engine_analysis/scan_direction_generator_fields.py \
            --binary game/fm_Data/Plugins/x86_64/game_plugin.dll \
            --out analysis/native-hotspots/direction-generator-fields \
            > analysis/native-hotspots/direction-generator-fields-console.log 2>&1
          cat analysis/native-hotspots/direction-generator-fields-console.log

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" \
            --output ghidra.zip
          mkdir ghidra
          unzip -q ghidra.zip -d ghidra

      - name: Decompile focused native behavior and shot hotspots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/native-hotspots ghidra-project-native-hotspots
          GHIDRA_SCRIPT_PATH=$(find ghidra -type f -name analyzeHeadless -print -quit)
          test -n "$GHIDRA_SCRIPT_PATH"
          GHIDRA_DIR=$(dirname "$GHIDRA_SCRIPT_PATH")
          chmod +x "$GHIDRA_DIR/analyzeHeadless"
          "$GHIDRA_DIR/analyzeHeadless" "$PWD/ghidra-project-native-hotspots" FM27NativeHotspots \
            -import "game/fm_Data/Plugins/x86_64/game_plugin.dll" \
            -overwrite -noanalysis \
            -scriptPath scripts/ghidra \
            -postScript TraceNativeHotspots.java "$PWD/analysis/native-hotspots" \
            > analysis/native-hotspots/ghidra-console.log 2>&1
          test -s analysis/native-hotspots/native-hotspot-summary.txt
          test -s analysis/native-hotspots/native-hotspot-decompilations.txt
          cat analysis/native-hotspots/native-hotspot-summary.txt

      - name: Upload focused native hotspot decompilations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FM27-Native-Hotspots
          path: analysis/native-hotspots/
          if-no-files-found: warn
          retention-days: 14
