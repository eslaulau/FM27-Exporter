name: FM27 Exporter PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "Run_FM27_Formal_Season_Export_v1.5.0.ps1"
      - "FM27_PlayerMatchReport_Recovery_v1.9_Formal.py"
      - "FM27_FirstTeam_Filter_v1.3.0.py"
      - "FM27_FormalPlayerReport_Enrichment_v1.1.py"
      - "FM27_CloudExport_IdentityPolicy.py"
      - "FM27_CloudExport_IdentityCache.py"
      - "FM27_PlayerMatchHistory_Archive_v1.0.py"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [fix/dynamic-identity-cache-scope]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install pinned reader
        run: python -m pip install "fmsave==0.14.3"

      - name: Compile exporter helpers
        run: |
          python -m py_compile FM27_PlayerMatchReport_Recovery_v1.9_Formal.py
          python -m py_compile FM27_FormalPlayerReport_Enrichment_v1.1.py
          python -m py_compile FM27_FirstTeam_Filter_v1.3.0.py
          python -m py_compile FM27_CloudExport_IdentityPolicy.py
          python -m py_compile FM27_CloudExport_IdentityCache.py
          python -m py_compile FM27_PlayerMatchHistory_Archive_v1.0.py

      - name: Test cloud identity publication policy
        run: python tests/test_cloud_identity_policy.py

      - name: Test per-club cloud identity cache inheritance
        run: python tests/test_cloud_identity_cache.py

      - name: Test conservative sparse-history identity learning
        run: python tests/test_sparse_identity_inference.py

      - name: Test save-local player-history archive scope
        run: python tests/test_player_history_archive_scope.py

      - name: Replay real-save identity regression fixture
        run: python tests/test_player_identity_inference.py
 
      - name: Test save-local formal competition discovery and raw goal reconciliation
        run: python tests/test_formal_competition_scope.py
      - name: Test raw player-match position and variant-aware rating recovery
        run: python tests/test_player_match_position_rating.py
      - name: Test native FM27 position-mask semantic validation
        run: python tests/test_position_semantic_validation.py
      - name: Test native FM27 match role-code semantic validation
        run: python tests/test_role_code_semantic_validation.py

      - name: Test first-team scope filtering and match-key fallback
        run: python tests/test_first_team_filter_v1_3.py

      - name: Parse Windows PowerShell exporter
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "Run_FM27_Formal_Season_Export_v1.5.0.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax validation passed."
