name: FM27 v1.5.0 Cloud Season Export

on:
  workflow_dispatch:
    inputs:
      source_asset:
        description: Exact .fm asset name in release fm27-saves (one save per run)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fm27-v150-cloud-export
  cancel-in-progress: false

jobs:
  cloud-export:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository with write access
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download, verify, export, validate and commit report folder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          SOURCE_ASSET: ${{ inputs.source_asset }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:REPOSITORY
          $sourceTag = 'fm27-saves'
          $name = $env:SOURCE_ASSET.Trim()
          if ([string]::IsNullOrWhiteSpace($name) -or [IO.Path]::GetExtension($name) -cne '.fm' -or [IO.Path]::GetFileName($name) -cne $name) {
            throw "Enter the exact .fm asset filename, without a path. Received: '$name'"
          }

          $root = Join-Path $env:RUNNER_TEMP ('FM27-v1.5.0-' + $env:RUN_ID)
          $downloads = Join-Path $root 'downloads'
          $outputs = Join-Path $root 'outputs'
          $baseName = [IO.Path]::GetFileNameWithoutExtension($name)
          $assetWork = Join-Path $downloads $baseName
          $slot = Join-Path $outputs $baseName
          New-Item -ItemType Directory -Path $assetWork,$slot -Force | Out-Null

          $releaseJson = & gh api "repos/$repo/releases/tags/$sourceTag"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read source release $sourceTag." }
          $release = ($releaseJson -join "`n") | ConvertFrom-Json
          $matches = @($release.assets | Where-Object { $_.name -ceq $name })
          if ($matches.Count -ne 1) { throw "Expected exactly one asset named '$name' in $sourceTag; found $($matches.Count)." }
          $asset = $matches[0]
          if ([long]$asset.size -le 0) { throw "Source asset has an invalid size: $name" }
          if ([string]::IsNullOrWhiteSpace([string]$asset.digest) -or $asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw "GitHub did not provide a valid SHA-256 digest for '$name'; refusing an unverified export."
          }
          $expectedSha = ([string]$asset.digest -replace '^sha256:', '').ToLowerInvariant()

          Write-Host "Downloading $name from $sourceTag"
          & gh release download $sourceTag --repo $repo --pattern $name --dir $assetWork --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download source save: $name" }
          $savePath = Join-Path $assetWork $name
          if (-not (Test-Path -LiteralPath $savePath -PathType Leaf)) { throw "Downloaded save is missing: $name" }
          $actualSize = (Get-Item -LiteralPath $savePath).Length
          if ($actualSize -ne [long]$asset.size) { throw "Downloaded save size mismatch: expected $($asset.size), got $actualSize." }
          $actualSha = (Get-FileHash -LiteralPath $savePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -cne $expectedSha) { throw "Downloaded save SHA-256 mismatch. Expected $expectedSha; got $actualSha." }
          Write-Host "Source integrity verified: $name | $actualSize bytes | sha256:$actualSha"

          $exporter = Join-Path $env:GITHUB_WORKSPACE 'Run_FM27_Formal_Season_Export_v1.5.0.ps1'
          $stdout = Join-Path $slot 'export.stdout.txt'
          $stderr = Join-Path $slot 'export.stderr.txt'
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $argumentLine = '-NoLogo -NoProfile -ExecutionPolicy Bypass -File "' + $exporter + '" -SavePath "' + $savePath + '"'
          $process = Start-Process -FilePath $powershell -ArgumentList $argumentLine -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $analysis = @(Get-ChildItem -LiteralPath $assetWork -Directory -Filter 'FM27_Analysis_*' -ErrorAction SilentlyContinue)
          if ($process.ExitCode -ne 0 -or $analysis.Count -ne 1) {
            throw "v1.5.0 export failed for $name (exit=$($process.ExitCode), analysis folders=$($analysis.Count)). See diagnostics artifact."
          }

          $reportFolder = Join-Path $slot $analysis[0].Name
          Copy-Item -LiteralPath $analysis[0].FullName -Destination $reportFolder -Recurse -Force
          Copy-Item -LiteralPath $stdout,$stderr -Destination $reportFolder -Force
          $manifest = [ordered]@{
            exporter_version = '1.5.0'
            source_asset = $name
            source_release = $sourceTag
            source_size_bytes = [long]$asset.size
            source_release_digest = [string]$asset.digest
            source_sha256_verified = $actualSha
            exported_at_utc = [DateTime]::UtcNow.ToString('o')
            workflow_run_id = [string]$env:RUN_ID
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $reportFolder 'cloud-export-manifest.json') -Encoding UTF8

          $required = @('save-info.json','validation.json','first-team-scope.json','fixtures.json','team-match-stats.json','players.json','player-season-stats.csv','player-match-report-formal-all.csv','player-match-report-formal-summary.json','player-report-identity-audit.json','FM27_PlayerIdentityCache_Formal_v1.1_learned.json')
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $reportFolder $_) -PathType Leaf) })
          if ($missing.Count -gt 0) { throw "Export is missing required outputs: $($missing -join ', ')" }
          foreach ($file in $required) {
            if ((Get-Item -LiteralPath (Join-Path $reportFolder $file)).Length -le 0) { throw "Required export output is empty: $file" }
          }
          $scope = Get-Content -LiteralPath (Join-Path $reportFolder 'first-team-scope.json') -Raw | ConvertFrom-Json
          if ([int]$scope.team_id -le 0 -or [int]$scope.club_uid -le 0) { throw 'Dynamic first-team scope validation failed.' }
          $null = Get-Content -LiteralPath (Join-Path $reportFolder 'validation.json') -Raw | ConvertFrom-Json
          $identityAudit = Get-Content -LiteralPath (Join-Path $reportFolder 'player-report-identity-audit.json') -Raw | ConvertFrom-Json
          $identityCache = Get-Content -LiteralPath (Join-Path $reportFolder 'FM27_PlayerIdentityCache_Formal_v1.1_learned.json') -Raw | ConvertFrom-Json
          if ([int]$identityAudit.team_id -ne [int]$scope.team_id) { throw "Identity audit team_id ($($identityAudit.team_id)) differs from managed first-team ID ($($scope.team_id))." }
          if ([int]$identityCache.team_id -ne [int]$scope.team_id -or [int]$identityCache.club_uid -ne [int]$scope.club_uid) { throw 'Learned identity cache does not match the dynamically resolved managed club/team.' }
          $identified = [int]$identityAudit.scope.identified_appearance_rows
          $actualAppearances = [int]$identityAudit.scope.actual_appearance_rows
          $unresolved = [int]$identityAudit.scope.unresolved_appearance_rows
          if ($identified -le 0 -or $identified -ne $actualAppearances -or $unresolved -ne 0) {
            throw "Player identity coverage failed: identified=$identified / appearances=$actualAppearances; unresolved=$unresolved. Refusing to publish an apparently successful report."
          }
          if (@($identityCache.mappings.PSObject.Properties).Count -le 0) { throw 'Learned identity cache contains no verified mappings.' }

          $summary = [ordered]@{
            status = 'exported_and_structurally_validated'
            exporter_version = '1.5.0'
            workflow_run_id = [string]$env:RUN_ID
            source_asset = $name
            source_sha256 = $actualSha
            source_size_bytes = $actualSize
            club_name = [string]$scope.club_name
            club_uid = [int]$scope.club_uid
            first_team_id = [int]$scope.team_id
            report_folder = "season-reports/$baseName/$($env:RUN_ID)/$($analysis[0].Name)"
          }
          $summary | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $reportFolder 'cloud-export-summary.json') -Encoding UTF8

          $relativeReportPath = "season-reports/$baseName/$($env:RUN_ID)"
          $destination = Join-Path $env:GITHUB_WORKSPACE ($relativeReportPath -replace '/', [IO.Path]::DirectorySeparatorChar)
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem -LiteralPath $reportFolder -Force | Copy-Item -Destination $destination -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'cloud-export-manifest.json') -PathType Leaf)) {
            throw 'Report folder staging failed: manifest is missing.'
          }
          $oversized = @(Get-ChildItem -LiteralPath $destination -File -Recurse | Where-Object { $_.Length -ge 100MB })
          if ($oversized.Count -gt 0) { throw "GitHub repository file-size limit would be exceeded: $($oversized.FullName -join ', ')" }

          git -C $env:GITHUB_WORKSPACE config user.name 'github-actions[bot]'
          git -C $env:GITHUB_WORKSPACE config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $env:GITHUB_WORKSPACE add -- $relativeReportPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the season report folder.' }
          git -C $env:GITHUB_WORKSPACE commit -m "Add FM27 season report: $baseName (run $($env:RUN_ID))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the season report folder.' }
          git -C $env:GITHUB_WORKSPACE push origin HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the season report folder to the repository.' }

          $verifyFiles = @($required + @('cloud-export-manifest.json','cloud-export-summary.json'))
          foreach ($file in $verifyFiles) {
            $localFile = Join-Path $destination $file
            if (-not (Test-Path -LiteralPath $localFile -PathType Leaf)) { throw "Committed report file is missing locally: $file" }
            $localBlob = (git -C $env:GITHUB_WORKSPACE hash-object -- $localFile).Trim()
            $repoPath = "$relativeReportPath/$file"
            $remoteBlob = (git -C $env:GITHUB_WORKSPACE rev-parse "HEAD:$repoPath" 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or $localBlob -cne $remoteBlob) { throw "Repository readback verification failed: $repoPath" }
          }

          Write-Host "Cloud export complete; uncompressed report folder committed and verified."
          Write-Host "Source: $name"
          Write-Host "Club: $($scope.club_name) | first-team ID: $($scope.team_id)"
          Write-Host "Repository folder: https://github.com/$repo/tree/main/$relativeReportPath"

      - name: Preserve runner diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FM27-v1.5.0-cloud-export-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/FM27-v1.5.0-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
