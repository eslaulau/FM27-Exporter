name: FM27 native simulation entry and ball physics trace
on:
  push:
    paths:
      - ".github/workflows/fm27-native-sim-entry-analysis.yml"
      - "scripts/engine_analysis/scan_native_engine_string_xrefs.py"
      - "scripts/engine_analysis/scan_native_target_callers.py"
      - "scripts/ghidra/DecompileMovementXrefFunctions.java"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fm27-native-sim-entry-analysis
  cancel-in-progress: true
jobs:
  native-sim-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify FM27 native package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/eslaulau/FM27-Exporter/releases/download/fm27-saves/FM27_Engine_Analysis_Package_20261125_v2.zip" \
            --output FM27_Engine_Analysis_Package_20261125_v2.zip
          echo "99f5207337e1f9cad84a4771ec08df6c9c9e34bea7c33ace7668124ca6bbb8d6  FM27_Engine_Analysis_Package_20261125_v2.zip" | sha256sum --check
          mkdir -p game
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("game").resolve()
          with zipfile.ZipFile("FM27_Engine_Analysis_Package_20261125_v2.zip") as z:
              for item in z.infolist():
                  name=item.filename.replace(chr(92),"/")
                  target=(root/name).resolve()
                  if target!=root and root not in target.parents:
                      raise SystemExit(f"unsafe archive path: {item.filename}")
                  if item.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(item) as src,target.open("wb") as dst:
                          while chunk:=src.read(1024*1024): dst.write(chunk)
          PY
          test -s game/fm_Data/Plugins/x86_64/game_plugin.dll
      - name: Scan callers of match tick and position update dispatchers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check capstone==5.0.6
          python scripts/engine_analysis/scan_native_target_callers.py \
            --binary game/fm_Data/Plugins/x86_64/game_plugin.dll \
            --out analysis/native-sim-entry \
            --target 0xE5C4C0:MATCH_TICK_EVENT_ROUTER \
            --target 0x28C1020:MATCH_STATE_MACHINE_TICK_ADVANCE \
            --target 0x47C5350:MATCH_STATE_MACHINE_TICK_DISPATCHER \
            --target 0x42D3910:MATCH_LEVEL_PLAYER_MOVEMENT_TICK_DRIVER \
            --target 0x2AFB290:MATCH_PLAYER_MOVEMENT_RECORD_AND_POSITION_WRITER \
            --target 0x5DBD0:MATCH_CANDIDATE_TICK_ORCHESTRATOR \
            --target 0x61660:CANDIDATE_TO_PLAYER_STATE_HANDOFF
          cat analysis/native-sim-entry/native-target-call-summary.json
      - name: Scan native match and ball simulation strings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/engine_analysis/scan_native_engine_string_xrefs.py \
            --binary game/fm_Data/Plugins/x86_64/game_plugin.dll \
            --out analysis/native-ball-strings \
            --term "simatch::MATCH::play" \
            --term "MATCH_BALL::iterate_one_slice" \
            --term "iterate_one_slice" \
            --term "MATCH_BALL" \
            --term "match_ball_path" \
            --term "simatch::MATCH_BALL" \
            --term "ball_velocity" \
            --term "ball_position" \
            --term "BallVelocity" \
            --term "BallContact" \
            --term "goalkeeper_save" \
            --term "goal_line" \
            --term "shot_result"
          cat analysis/native-ball-strings/native-engine-string-summary.json
          cat analysis/native-ball-strings/native-engine-string-xrefs.tsv
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" \
            --output ghidra.zip
          mkdir ghidra
          unzip -q ghidra.zip -d ghidra
      - name: Decompile native simulation entry and ball/string reference functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/native-sim-entry ghidra-project-native-sim
          {
            head -n 1 analysis/native-sim-entry/native-target-call-xrefs.tsv
            tail -n +2 analysis/native-sim-entry/native-target-call-xrefs.tsv
            tail -n +2 analysis/native-ball-strings/native-engine-string-xrefs.tsv
          } > analysis/native-sim-entry/combined-native-engine-xrefs.tsv
          GHIDRA_SCRIPT_PATH=$(find ghidra -type f -name analyzeHeadless -print -quit)
          test -n "$GHIDRA_SCRIPT_PATH"
          GHIDRA_DIR=$(dirname "$GHIDRA_SCRIPT_PATH")
          chmod +x "$GHIDRA_DIR/analyzeHeadless"
          "$GHIDRA_DIR/analyzeHeadless" "$PWD/ghidra-project-native-sim" FM27NativeSimEntry \
            -import "game/fm_Data/Plugins/x86_64/game_plugin.dll" \
            -overwrite -noanalysis \
            -scriptPath scripts/ghidra \
            -postScript DecompileMovementXrefFunctions.java \
              "$PWD/analysis/native-sim-entry/combined-native-engine-xrefs.tsv" \
              "$PWD/analysis/native-sim-entry" \
            > analysis/native-sim-entry/ghidra-console.log 2>&1
          test -s analysis/native-sim-entry/native-rtti-caller-summary.txt
          test -s analysis/native-sim-entry/native-rtti-caller-decompilations.txt
          cat analysis/native-sim-entry/native-rtti-caller-summary.txt
      - name: Upload native simulation and ball physics trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FM27-Native-Simulation-Ball-Trace
          path: |
            analysis/native-sim-entry/
            analysis/native-ball-strings/
          if-no-files-found: warn
          retention-days: 14
