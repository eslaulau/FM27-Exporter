name: Export public FM27 saves

on:
  workflow_dispatch:
    inputs:
      save_set:
        description: Which tactic trials to export
        type: choice
        required: true
        default: all
        options:
          - all
          - tactic1
          - tactic2
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: fm27-public-save-export
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.title == 'FM27 Export Control' &&
        github.event.comment.user.login == github.repository_owner &&
        (startsWith(github.event.comment.body, '/export ') || github.event.comment.body == '/validate')
      )
    name: Validate exporter scripts and six-save manifest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exporter
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate Python and PowerShell syntax
        shell: pwsh
        run: |
          python -m py_compile FM27_Tactic_Trial_Comparison_v1.0.py
          if ($LASTEXITCODE -ne 0) { throw 'Python comparison script syntax validation failed.' }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/Invoke-PublicExport.ps1').Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell export runner syntax validation failed.'
          }

          $cache = Get-Content './FM27_PlayerIdentityCache_Formal_v1.1.json' -Raw | ConvertFrom-Json
          if ([int]$cache.team_id -ne 539) { throw 'Player identity cache team_id mismatch.' }
          Write-Host 'Python, PowerShell and identity-cache validation passed.'

      - name: Validate six public source save assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gh = (Get-Command gh -ErrorAction Stop).Source
          $repo = $env:GITHUB_REPOSITORY
          $json = & $gh api "repos/$repo/releases/tags/fm27-saves"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read public source release fm27-saves.' }
          $release = ($json -join '') | ConvertFrom-Json
          $assets = @($release.assets | Where-Object { $_.name -match '^.+-[1-3]\.fm$' })
          if ($assets.Count -ne 6) { throw "Expected six .fm save assets, found $($assets.Count)." }
          $groups = @($assets | ForEach-Object { [regex]::Match($_.name, '^(.+)-[1-3]\.fm$').Groups[1].Value } | Sort-Object -Unique)
          if ($groups.Count -ne 2) { throw "Expected two tactic names, found $($groups.Count)." }
          foreach ($name in $groups) {
            $runs = @($assets | Where-Object { $_.name -match ('^' + [regex]::Escape($name) + '-[1-3]\.fm$') } |
              ForEach-Object { [int]([regex]::Match($_.name, '-([1-3])\.fm$').Groups[1].Value) } | Sort-Object)
            if (($runs -join ',') -ne '1,2,3') { throw "Tactic $name does not have the three -1/-2/-3 files." }
          }
          Write-Host ('Validated two tactics and six saves: ' + ($groups -join ' | '))

  export:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.title == 'FM27 Export Control' &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/export ')
      )
    name: Export public saves and publish tactic comparison
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout exporter
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Resolve command and run six-trial comparison
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SAVE_SET: ${{ github.event.inputs.save_set }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $saveSet = $env:INPUT_SAVE_SET
          if ($env:EVENT_NAME -eq 'issue_comment') {
            $command = $env:COMMENT_BODY.Trim()
            if ($command -notmatch '^/export\s+(all|tactic1|tactic2)$') {
              throw 'Invalid export command. Use /export all, /export tactic1 or /export tactic2.'
            }
            $saveSet = $Matches[1].ToLowerInvariant()
          }
          if ($saveSet -notin @('all', 'tactic1', 'tactic2')) {
            throw 'Invalid save selection.'
          }
          Write-Host ('Starting public FM27 tactic comparison: ' + $saveSet)
          ./scripts/Invoke-PublicExport.ps1 -SaveSet $saveSet

      - name: Report result to control issue
        if: ${{ always() && github.event_name == 'issue_comment' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $body = "FM27 six-trial tactic comparison run $($env:RUN_ID) finished with status: **$($env:JOB_STATUS)**.$([Environment]::NewLine)$([Environment]::NewLine)Run: https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)$([Environment]::NewLine)Reports: https://github.com/$($env:REPOSITORY)/releases/tag/fm27-exports"
          gh issue comment $env:ISSUE_NUMBER --repo $env:REPOSITORY --body $body
