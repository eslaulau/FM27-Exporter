name: Export public FM27 saves

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      save_set:
        description: Which tactic trials to export
        type: choice
        required: true
        default: all
        options:
          - all
          - tactic1
          - tactic2
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: fm27-public-save-export
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[fm27-analysis]')) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.title == 'FM27 Export Control' &&
        github.event.comment.user.login == github.repository_owner &&
        (startsWith(github.event.comment.body, '/export ') || startsWith(github.event.comment.body, '/recover ') || startsWith(github.event.comment.body, '/analyze ') || github.event.comment.body == '/validate')
      )
    name: Validate exporter scripts and six-save manifest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exporter
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate Python, PowerShell syntax and summary serialization
        shell: pwsh
        run: |
          python -m py_compile FM27_Tactic_Trial_Comparison_v1.0.py
          if ($LASTEXITCODE -ne 0) { throw 'Python comparison script syntax validation failed.' }

          foreach ($path in @('./scripts/Invoke-PublicExport.ps1', './scripts/Recover-PublicComparison.ps1', './scripts/Prepare-AnalysisArtifact.ps1', './scripts/Invoke-LatestReleaseAssetExport.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $path"
            }
          }

          $sampleList = New-Object System.Collections.Generic.List[object]
          [void]$sampleList.Add([pscustomobject]@{ tactic_name = 'sample'; trial = 1 })
          $sampleSummary = [ordered]@{
            test_saves = [object[]]$sampleList.ToArray()
            tactic_names = [string[]]@('sample-a', 'sample-b')
          }
          $sampleJson = ConvertTo-Json -InputObject $sampleSummary -Depth 10
          $sampleDecoded = $sampleJson | ConvertFrom-Json
          if (@($sampleDecoded.test_saves).Count -ne 1) { throw 'Summary array serialization self-test failed.' }

          $cache = Get-Content './FM27_PlayerIdentityCache_Formal_v1.1.json' -Raw | ConvertFrom-Json
          if ([int]$cache.team_id -ne 539) { throw 'Player identity cache team_id mismatch.' }
          Write-Host 'Python, PowerShell, summary serialization and identity-cache validation passed.'

      - name: Validate six public source save assets
        shell: pwsh
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          $gh = (Get-Command gh -ErrorAction Stop).Source
          $repo = $env:GITHUB_REPOSITORY
          $json = & $gh api "repos/$repo/releases/tags/fm27-saves"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read public source release fm27-saves.' }
          $release = ($json -join '') | ConvertFrom-Json
          $assets = @($release.assets | Where-Object { $_.name -match '^.+-[1-3]\.fm$' })
          if ($assets.Count -ne 6) { throw "Expected six .fm save assets, found $($assets.Count)." }
          $groups = @($assets | ForEach-Object { [regex]::Match($_.name, '^(.+)-[1-3]\.fm$').Groups[1].Value } | Sort-Object -Unique)
          if ($groups.Count -ne 2) { throw "Expected two tactic names, found $($groups.Count)." }
          foreach ($name in $groups) {
            $runs = @($assets | Where-Object { $_.name -match ('^' + [regex]::Escape($name) + '-[1-3]\.fm$') } |
              ForEach-Object { [int]([regex]::Match($_.name, '-([1-3])\.fm$').Groups[1].Value) } | Sort-Object)
            if (($runs -join ',') -ne '1,2,3') { throw "Tactic $name does not have the three -1/-2/-3 files." }
          }
          Write-Host ('Validated two tactics and six saves: ' + ($groups -join ' | '))

  export:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[fm27-analysis]')) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.title == 'FM27 Export Control' &&
        github.event.comment.user.login == github.repository_owner &&
        (startsWith(github.event.comment.body, '/export ') || startsWith(github.event.comment.body, '/recover ') || startsWith(github.event.comment.body, '/analyze '))
      )
    name: Export or recover FM27 trial reports
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout exporter
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Resolve command and export or recover comparison
        shell: pwsh
        env:
          GH_TOKEN: ${{github.token}}
          EVENT_NAME: ${{github.event_name}}
          INPUT_SAVE_SET: ${{github.event.inputs.save_set}}
          COMMENT_BODY: ${{github.event.comment.body}}
          HEAD_COMMIT_MESSAGE: ${{github.event.head_commit.message}}
        run: |
          if ($env:EVENT_NAME -eq 'issue_comment') {
            $command = $env:COMMENT_BODY.Trim()
          } elseif ($env:EVENT_NAME -eq 'push' -and $env:HEAD_COMMIT_MESSAGE -match '\[fm27-analysis\]\s*(/analyze\s+\d+|/export-latest-two)') {
            $command = $Matches[1]
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $saveSet = $env:INPUT_SAVE_SET
            Write-Host ('Starting public FM27 tactic export: ' + $saveSet)
            ./scripts/Invoke-PublicExport.ps1 -SaveSet $saveSet
            exit 0
          } else {
            throw 'Unsupported event or missing [fm27-analysis] command marker.'
          }

          if ($command -match '^/analyze\s+(\d+)$') {
            $sourceRunId = $Matches[1]
            Write-Host ('Preparing in-depth analysis inputs from run ' + $sourceRunId)
            ./scripts/Prepare-AnalysisArtifact.ps1 -SourceRunId $sourceRunId
            exit 0
          }
          if ($command -match '^/recover\s+(\d+)          if ($command -notmatch '^/export\s+(all|tactic1|tactic2)$') {
            throw 'Invalid command. Use /export all, /export tactic1, /export tactic2, /recover RUN_ID or /analyze RUN_ID.'
          }
          $saveSet = $Matches[1].ToLowerInvariant()
          Write-Host ('Starting public FM27 tactic comparison: ' + $saveSet)
          ./scripts/Invoke-PublicExport.ps1 -SaveSet $saveSet

      - name: Upload six-trial analysis inputs
        if: ${{success() && ((github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/analyze ')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '/analyze ')))}}
        uses: actions/upload-artifact@v4
        with:
          name: FM27-analysis-inputs-${{github.run_id}}
          path: _analysis-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload latest-two season reports
        if: ${{success() && github.event_name == 'push' && contains(github.event.head_commit.message, '/export-latest-two')}}
        uses: actions/upload-artifact@v4
        with:
          name: FM27-latest-two-season-reports-${{github.run_id}}
          path: _latest-two-export/
          if-no-files-found: error
          retention-days: 14

      - name: Report result to control issue
        if: ${{always() && github.event_name == 'issue_comment'}}
        shell: pwsh
        env:
          GH_TOKEN: ${{github.token}}
          ISSUE_NUMBER: ${{github.event.issue.number}}
          JOB_STATUS: ${{job.status}}
          RUN_ID: ${{github.run_id}}
          REPOSITORY: ${{github.repository}}
        run: |
          $body = "FM27 report job run $($env:RUN_ID) finished with status: **$($env:JOB_STATUS)**.$([Environment]::NewLine)$([Environment]::NewLine)Run: https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)$([Environment]::NewLine)Reports: https://github.com/$($env:REPOSITORY)/releases/tag/fm27-exports"
          gh issue comment $env:ISSUE_NUMBER --repo $env:REPOSITORY --body $body
) {
            $sourceRunId = $Matches[1]
            Write-Host ('Recovering preserved trial exports from run ' + $sourceRunId)
            ./scripts/Recover-PublicComparison.ps1 -SourceRunId $sourceRunId
            exit 0
          }
          if ($command -eq '/export-latest-two') {
            Write-Host 'Exporting the two newest .fm save assets from Release fm27-exports.'
            ./scripts/Invoke-LatestReleaseAssetExport.ps1
            exit 0
          }
          if ($command -notmatch '^/export\s+(all|tactic1|tactic2)$') {
            throw 'Invalid command. Use /export all, /export tactic1, /export tactic2, /recover RUN_ID or /analyze RUN_ID.'
          }
          $saveSet = $Matches[1].ToLowerInvariant()
          Write-Host ('Starting public FM27 tactic comparison: ' + $saveSet)
          ./scripts/Invoke-PublicExport.ps1 -SaveSet $saveSet

      - name: Upload six-trial analysis inputs
        if: ${{success() && ((github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/analyze ')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fm27-analysis]')))}}
        uses: actions/upload-artifact@v4
        with:
          name: FM27-analysis-inputs-${{github.run_id}}
          path: _analysis-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Report result to control issue
        if: ${{always() && github.event_name == 'issue_comment'}}
        shell: pwsh
        env:
          GH_TOKEN: ${{github.token}}
          ISSUE_NUMBER: ${{github.event.issue.number}}
          JOB_STATUS: ${{job.status}}
          RUN_ID: ${{github.run_id}}
          REPOSITORY: ${{github.repository}}
        run: |
          $body = "FM27 report job run $($env:RUN_ID) finished with status: **$($env:JOB_STATUS)**.$([Environment]::NewLine)$([Environment]::NewLine)Run: https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)$([Environment]::NewLine)Reports: https://github.com/$($env:REPOSITORY)/releases/tag/fm27-exports"
          gh issue comment $env:ISSUE_NUMBER --repo $env:REPOSITORY --body $body
