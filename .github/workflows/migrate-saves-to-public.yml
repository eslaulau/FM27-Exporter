name: One-time migrate FM27 saves to public

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Copy the three saves into the public repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copy save assets from the old repository
        shell: pwsh
        env:
          SOURCE_TOKEN: \${{ secrets.FM27_ACCESS_TOKEN }}
          PUBLIC_TOKEN: \${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRepo = 'eslaulau/FM27'
          $targetRepo = $env:GITHUB_REPOSITORY
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_TOKEN)) {
            throw 'The existing FM27_ACCESS_TOKEN secret is missing. It is only needed for this one-time migration.'
          }

          $manifest = @(
            [pscustomobject]@{ Asset = 'Vanco_4Back_Vertical_01_run31-1.fm'; Bytes = [int64]110859875; Sha256 = '307ebeb47dba47ee1e06722398d647d93efa6cadb3ce85665187e83237360aa3' },
            [pscustomobject]@{ Asset = 'Vanco_4Back_Vertical_01_run31-2.fm'; Bytes = [int64]111711774; Sha256 = '2afb1d78b1cde5d5beaa48d96df8f9a4a6c16cd651f95f9c003bf5922df6e1b6' },
            [pscustomobject]@{ Asset = 'Vanco_4Back_Vertical_01_run31-3.fm'; Bytes = [int64]111138678; Sha256 = '610eba7688e95047903e0a1d76aec149b3756404bd0fde4d424f1e64b0143ca4' }
          )

          $gh = (Get-Command gh -ErrorAction Stop).Source
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'FM27-Public-Migration'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null

          # Read the old private Release using the existing narrowly-scoped token.
          $env:GH_TOKEN = $env:SOURCE_TOKEN
          $release = & $gh api "repos/$sourceRepo/releases/tags/fm" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot access the source Release in eslaulau/FM27.' }
          $releaseObject = ($release -join '') | ConvertFrom-Json
          $available = @($releaseObject.assets | ForEach-Object { $_.name })

          foreach ($item in $manifest) {
            if ($available -notcontains $item.Asset) { throw ('Source Release is missing ' + $item.Asset) }
            & $gh release download fm --repo $sourceRepo --pattern $item.Asset --dir $downloadRoot --clobber
            if ($LASTEXITCODE -ne 0) { throw ('Download failed for ' + $item.Asset) }
            $file = Join-Path $downloadRoot $item.Asset
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw ('Downloaded file is missing: ' + $item.Asset) }
            if ((Get-Item -LiteralPath $file).Length -ne $item.Bytes) { throw ('File-size validation failed: ' + $item.Asset) }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $item.Sha256) { throw ('SHA256 validation failed: ' + $item.Asset) }
            Write-Host ('Verified source save: ' + $item.Asset)
          }

          # Switch to the automatically-scoped public-repository token for upload.
          $env:GH_TOKEN = $env:PUBLIC_TOKEN
          & $gh release view fm27-saves --repo $targetRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            & $gh release create fm27-saves --repo $targetRepo --target main --title 'FM27 Career Saves (Public)' --notes 'These FM27 career saves are intentionally public and are used as source inputs by the FM27 Exporter. The exporter reads the files and does not modify them.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the public source-save Release.' }
          }

          $files = @($manifest | ForEach-Object { Join-Path $downloadRoot $_.Asset })
          $uploadArgs = @('release', 'upload', 'fm27-saves') + $files + @('--repo', $targetRepo, '--clobber')
          & $gh @uploadArgs
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all saves to the public repository.' }

          Write-Host 'Migration complete: all three source saves are now in the public fm27-saves Release.'
          Write-Host ('https://github.com/' + $targetRepo + '/releases/tag/fm27-saves')
